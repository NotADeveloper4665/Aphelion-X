name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and Electron checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check application version metadata
        run: node --test scripts/verify-version-alignment.cjs
      - run: npm ci
      - name: Full Linux test suite
        if: runner.os == 'Linux'
        run: npm test
      - name: Nonpublishing candidate consistency tests
        if: runner.os == 'Linux'
        run: node --test scripts/verify-ci-candidate-manifest.cjs scripts/verify-ci-transport-mock.cjs
      - name: Read-only release simulation (synthetic inputs only)
        if: runner.os == 'Linux'
        run: node --test scripts/verify-release-simulation.cjs
      - name: Windows frontend and Electron tests
        if: runner.os == 'Windows'
        run: npx vitest run && node --test electron/verify-security.cjs electron/verify-icons.cjs electron/verify-windows.cjs electron/verify-window-state.cjs electron/verify-window-drag.cjs
      - name: Linux frontend build
        if: runner.os == 'Linux'
        run: npm run build
      # The npm copy-login script is POSIX-only; reproduce its file copy
      # using PowerShell, then verify the resulting bundled login asset.
      - name: Windows frontend compilation and bundle
        if: runner.os == 'Windows'
        run: |
          npx tsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item public/login.html dist/login.html -ErrorAction Stop
          if ((Get-FileHash public/login.html).Hash -ne (Get-FileHash dist/login.html).Hash) { throw 'login asset mismatch' }

  linux-backend:
    name: Linux backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check both TLS lockfiles without resolving dependencies
        run: python3 scripts/check-tls-locks.py
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin xjaus_backend
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        env:
          TMPDIR: ${{ runner.temp }}

  windows-backend:
    name: Windows backend build and tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --manifest-path backend-windows/Cargo.toml --bin xjaus_backend
      - run: cargo test --locked --manifest-path backend-windows/Cargo.toml

  linux-kde-frontend:
    name: Linux KDE build and RPM candidate
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Qt and KDE Frameworks build dependencies
        run: dnf -y install cargo cmake gcc-c++ extra-cmake-modules kf6-kirigami-devel libsecret-devel nodejs npm qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel qt6-qtwebchannel-devel qt6-qtwebengine-devel rpm-build webkit2gtk4.1-devel python3 xorg-x11-server-Xvfb xauth
      - name: Build shared web renderer
        run: npm ci && npm run build
      - name: Build Rust sidecar
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin xjaus_backend
      - name: Configure KDE frontend
        run: cmake -S kde-linux -B build/kde-linux -DCMAKE_BUILD_TYPE=Release -DXJAUS_DISCOVERY_SMOKE=ON -DXJAUS_BACKEND_PATH="$GITHUB_WORKSPACE/src-tauri/target/release/xjaus_backend"
      - name: Build KDE frontend
        run: cmake --build build/kde-linux --parallel 2
      - name: Verify console discovery through Qt
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QT_QUICK_BACKEND: software
        run: xvfb-run -a ctest --test-dir build/kde-linux --output-on-failure
      - name: Package Fedora candidate
        run: cpack --config build/kde-linux/CPackConfig.cmake -B release/linux-kde
      - uses: actions/upload-artifact@v4
        with:
          name: xjaus-kde-fedora-rpm
          path: release/linux-kde/*.rpm
          if-no-files-found: error
          retention-days: 7
